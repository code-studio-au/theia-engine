[package]
name = "theia-render-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
theia-assets = { path = "../../crates/theia-assets" }
serde_json = "1"
theia-sim = { path = "../../crates/theia-sim" }
theia-protocol = { path = "../../crates/theia-protocol" }
theia-network-fixture = { path = "../../crates/theia-network-fixture" }
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt", "time", "sync"] }
