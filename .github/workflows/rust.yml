name: Rust qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [apps/theia-gpu-test, apps/theia-render-lab, crates/theia-ecs, apps/theia-ecs-lab, crates/theia-assets, tools/theia-gltf-import, crates/theia-sim, apps/theia-server-lab]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path ${{ matrix.package }}/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --locked --manifest-path ${{ matrix.package }}/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests and build
        run: cargo test --locked --manifest-path ${{ matrix.package }}/Cargo.toml
  authority:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute bounded authoritative movement qualification
        run: cargo run --locked --manifest-path apps/theia-server-lab/Cargo.toml -- --ticks 10000
      - name: Execute bounded authoritative combat qualification
        run: cargo run --locked --manifest-path apps/theia-server-lab/Cargo.toml -- --combat-test
  shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SPIR-V tools
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
      - name: Fetch qualified Slang compiler
        run: |
          curl --fail --location --retry 3 https://github.com/shader-slang/slang/releases/download/v2026.19/slang-2026.19-linux-x86_64-glibc-2.28.tar.gz -o "$RUNNER_TEMP/slang.tar.gz"
          echo "bd7afcb0956dee9304f44ed115e9aaa7140704271b5c3294bcb237e3ae67adc7  $RUNNER_TEMP/slang.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/slang"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"
      - name: Compile and validate Slang task/mesh/fragment shaders
        run: python3 tools/compile_render_shaders.py --slangc "$RUNNER_TEMP/slang/bin/slangc"
      - name: Fetch qualified GLSL primitive-interface compiler
        run: |
          curl --fail --location --retry 3 'https://archive.ubuntu.com/ubuntu/pool/universe/g/glslang/glslang-tools_15.1.0-2~ubuntu0.24.04.2_amd64.deb' -o "$RUNNER_TEMP/glslang.deb"
          echo "8767bba0e4cc781a5de0da3e662f656664cc3b8de2399aef6755bac61137727e  $RUNNER_TEMP/glslang.deb" | sha256sum --check -
          dpkg-deb -x "$RUNNER_TEMP/glslang.deb" "$RUNNER_TEMP/glslang"
      - name: Compile and validate optional shared primitive interface
        run: python3 tools/compile_render_shaders.py --slangc "$RUNNER_TEMP/slang/bin/slangc" --shared-primitive-interface --glslang "$RUNNER_TEMP/glslang/usr/bin/glslangValidator" --output-dir build/shaders-shared
      - name: Compile and validate M1 ECS reference compute shaders
        run: python3 tools/compile_ecs_shaders.py --slangc "$RUNNER_TEMP/slang/bin/slangc"
      - name: Validate preserved compute shader
        run: |
          "$RUNNER_TEMP/slang/bin/slangc" shaders/compute/buffer_test.slang -entry computeMain -stage compute -target spirv -profile spirv_1_6 -o build/shaders/buffer_test.spv
          spirv-val --target-env vulkan1.3 build/shaders/buffer_test.spv
      - name: Build qualified offline meshoptimizer tool
        run: |
          curl --fail --location --retry 3 https://github.com/zeux/meshoptimizer/releases/download/v1.3/meshoptimizer-1.3.tar.gz -o "$RUNNER_TEMP/meshoptimizer.tar.gz"
          echo "d50a0b5e1323ba4379cdb32f89436c20652b7393445f8e18c88ae64445b67b77  $RUNNER_TEMP/meshoptimizer.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/meshoptimizer"
          tar -xzf "$RUNNER_TEMP/meshoptimizer.tar.gz" -C "$RUNNER_TEMP/meshoptimizer"
          cmake -S "$RUNNER_TEMP/meshoptimizer/meshoptimizer-1.3" -B "$RUNNER_TEMP/meshopt-build" -DCMAKE_BUILD_TYPE=Release -DMESHOPT_BUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/meshopt-build" --parallel 2
      - name: Qualify meshlet fixture coverage and Rust container reader
        run: |
          python3 tools/cook_meshlet_fixture.py --library "$RUNNER_TEMP/meshopt-build/libmeshoptimizer.so" --source-archive "$RUNNER_TEMP/meshoptimizer.tar.gz"
          python3 tools/cook_meshlet_fixture.py --fixture quad --library "$RUNNER_TEMP/meshopt-build/libmeshoptimizer.so" --source-archive "$RUNNER_TEMP/meshoptimizer.tar.gz"
          cargo run --locked --manifest-path crates/theia-assets/Cargo.toml --example inspect -- "$(python3 -c 'import json; print(json.load(open("build/assets/grid16-report.json"))["path"])')"
      - name: Qualify bounded terrain LOD and page lifetime contract
        run: |
          python3 -m unittest discover -s tools -p test_height_lod.py
          python3 -m unittest discover -s tools -p test_continuous_height_error.py
          python3 tools/cook_meshlet_fixture.py --fixture terrain16 --library "$RUNNER_TEMP/meshopt-build/libmeshoptimizer.so" --source-archive "$RUNNER_TEMP/meshoptimizer.tar.gz"
          python3 tools/cook_meshlet_fixture.py --fixture terrain16 --simplify-ratio .25 --library "$RUNNER_TEMP/meshopt-build/libmeshoptimizer.so" --source-archive "$RUNNER_TEMP/meshoptimizer.tar.gz"
          python3 tools/cook_meshlet_fixture.py --fixture occlusion --library "$RUNNER_TEMP/meshopt-build/libmeshoptimizer.so" --source-archive "$RUNNER_TEMP/meshoptimizer.tar.gz"
          python3 - <<'PY'
          import json, subprocess, sys
          full = json.load(open('build/assets/terrain16-report.json'))['path']
          coarse = json.load(open('build/assets/terrain16-lod-report.json'))['path']
          manifest = subprocess.check_output([sys.executable, 'tools/package_cell.py', '--cell', '8', full, coarse], text=True).strip()
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'inspect', '--', coarse], check=True)
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'residency', '--', manifest], check=True)
          PY
      - name: Qualify CPU projected heightfield LOD selection
        run: |
          python3 - <<'PY'
          import json, subprocess
          fine = json.load(open('build/assets/terrain16-report.json'))['path']
          coarse = json.load(open('build/assets/terrain16-lod-report.json'))['path']
          for width, height, budget, expected in [(960, 540, 1, 'Fine'), (960, 540, 10, 'Coarse'), (1920, 1080, 10, 'Fine')]:
              output = subprocess.check_output(['cargo', 'run', '--locked', '--manifest-path', 'apps/theia-render-lab/Cargo.toml', '--', '--lod-reference', fine, coarse, str(width), str(height), '2', str(budget)], text=True)
              assert json.loads(output.splitlines()[-1])['level'] == expected
          PY
      - name: Qualify offline LOD guard fixtures and source bindings
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          fine = json.load(open('build/assets/terrain16-report.json'))['path']
          coarse = json.load(open('build/assets/terrain16-lod-report.json'))['path']
          for name, translation in [('far', '32'), ('near', '-1.5')]:
              report = json.loads(subprocess.check_output([sys.executable, 'tools/qualify_lod_guards.py', '--fine', fine, '--coarse', coarse, '--translation-y', translation, '--output-dir', 'build/lod-guard-' + name], text=True))
              for role in ['fine', 'coarse']:
                  subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'inspect', '--', report[role]], check=True)
              output = subprocess.check_output(['cargo', 'run', '--locked', '--manifest-path', 'apps/theia-render-lab/Cargo.toml', '--', '--lod-reference', report['fine'], report['coarse'], '960', '540', '2', '6'], text=True)
              assert json.loads(output.splitlines()[-1])['reason'] == 'ClipBoundary'
          PY
      - name: Qualify bounded static glTF normalization and cooking
        run: |
          cargo run --locked --manifest-path tools/theia-gltf-import/Cargo.toml -- fixtures/gltf/transformed_scene.gltf build/assets/imported-scene.json
          python3 tools/cook_meshlet_fixture.py --geometry build/assets/imported-scene.json --library "$RUNNER_TEMP/meshopt-build/libmeshoptimizer.so" --source-archive "$RUNNER_TEMP/meshoptimizer.tar.gz"
          python3 - <<'PY'
          import json, subprocess
          asset = json.load(open('build/assets/imported-report.json'))['path']
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'inspect', '--', asset], check=True)
          PY
      - name: Qualify bounded opaque material sidecar
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          mesh = json.load(open('build/assets/imported-report.json'))
          assert mesh['triangles'] == 4
          source = json.load(open('fixtures/materials/imported_unlit.json'))
          # Synthetic test fixture: normalizer binary/compiler provenance varies per build.
          source['geometry_sha256'] = mesh['content_id']
          path = pathlib.Path('build/assets/test-unlit-assignments.json')
          path.write_text(json.dumps(source, sort_keys=True))
          page = json.loads(subprocess.check_output([sys.executable, 'tools/cook_material_page.py', '--mesh', mesh['path'], '--assignments', str(path)], text=True))
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'material', '--', mesh['path'], page['path']], check=True)
          PY
      - name: Qualify bounded glTF unlit import and material remapping
        run: |
          python3 -m unittest discover -s tools -p test_material_remap.py
          cargo run --locked --manifest-path tools/theia-gltf-import/Cargo.toml -- fixtures/gltf/transformed_scene_unlit.gltf build/assets/imported-unlit-scene.json --unlit-factors
          python3 tools/cook_meshlet_fixture.py --geometry build/assets/imported-unlit-scene.json --library "$RUNNER_TEMP/meshopt-build/libmeshoptimizer.so" --source-archive "$RUNNER_TEMP/meshoptimizer.tar.gz"
          python3 - <<'PY'
          import json, subprocess
          report = json.load(open('build/assets/imported-report.json'))
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'inspect', '--', report['path']], check=True)
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'material', '--', report['path'], report['materials']['path']], check=True)
          PY
      - name: Qualify authored float2 UV import and exact geometry binding
        run: |
          cargo run --locked --manifest-path tools/theia-gltf-import/Cargo.toml -- fixtures/gltf/transformed_scene_uv.gltf build/assets/imported-uv-scene.json --unlit-uv
          python3 tools/cook_meshlet_fixture.py --geometry build/assets/imported-uv-scene.json --library "$RUNNER_TEMP/meshopt-build/libmeshoptimizer.so" --source-archive "$RUNNER_TEMP/meshoptimizer.tar.gz"
          python3 - <<'PY'
          import json, subprocess
          report = json.load(open('build/assets/imported-report.json'))
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'uv', '--', report['path'], report['uv']['path']], check=True)
          PY
      - name: Qualify bounded resident texture container
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/KhronosGroup/KTX-Software/tar.gz/refs/tags/v4.4.2 -o "$RUNNER_TEMP/ktx-source.tar.gz"
          echo "9412cb45045a503005acd47d98f9e8b47154634a50b4df21e17a1dfa8971d323  $RUNNER_TEMP/ktx-source.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/ktx-source"
          tar -xzf "$RUNNER_TEMP/ktx-source.tar.gz" -C "$RUNNER_TEMP/ktx-source"
          cmake -S "$RUNNER_TEMP/ktx-source/KTX-Software-4.4.2" -B "$RUNNER_TEMP/ktx-build" -DCMAKE_BUILD_TYPE=Release -DKTX_GIT_VERSION_FULL=v4.4.2 -DKTX_FEATURE_ETC_UNPACK=OFF -DKTX_FEATURE_TESTS=OFF -DKTX_FEATURE_DOC=OFF -DKTX_FEATURE_TOOLS=ON
          cmake --build "$RUNNER_TEMP/ktx-build" --target ktxtools --parallel 2
          python3 -m unittest discover -s tools -p test_texture_cook.py
          python3 tools/cook_texture.py --ktx "$RUNNER_TEMP/ktx-build/Release/ktx" --build-dir "$RUNNER_TEMP/ktx-build" --source-archive "$RUNNER_TEMP/ktx-source.tar.gz" --source fixtures/textures/opaque_2x2.json > build/texture-report.json
          python3 - <<'PY'
          import json, subprocess
          texture = json.load(open('build/texture-report.json'))['path']
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'texture', '--', texture], check=True)
          PY
      - name: Qualify complete immutable textured bundle admission
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          mesh = json.load(open('build/assets/imported-report.json'))
          texture = json.load(open('build/texture-report.json'))
          bundle = json.loads(subprocess.check_output([sys.executable, 'tools/package_texture_bundle.py', '--mesh', mesh['path'], '--materials', mesh['materials']['path'], '--uvs', mesh['uv']['path'], '--texture', texture['path']], text=True))
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'bundle', '--', bundle['path']], check=True)
          PY
      - name: Qualify authored shared PNG texture import
        run: |
          cargo run --locked --manifest-path tools/theia-gltf-import/Cargo.toml -- fixtures/gltf/transformed_scene_texture.gltf build/assets/imported-textured-scene.json --unlit-texture
          python3 tools/cook_meshlet_fixture.py --geometry build/assets/imported-textured-scene.json --library "$RUNNER_TEMP/meshopt-build/libmeshoptimizer.so" --source-archive "$RUNNER_TEMP/meshoptimizer.tar.gz" --ktx "$RUNNER_TEMP/ktx-build/Release/ktx" --ktx-build "$RUNNER_TEMP/ktx-build" --ktx-source-archive "$RUNNER_TEMP/ktx-source.tar.gz"
          python3 - <<'PY'
          import json, struct, subprocess
          report = json.load(open('build/assets/imported-report.json'))
          data = open(report['texture']['path'], 'rb').read()
          offset, size, _ = struct.unpack_from('<3Q', data, 80)
          raw = json.load(open('fixtures/textures/opaque_2x2.json'))
          assert data[offset:offset+size] == bytes(v for texel in raw['rgba'] for v in texel)
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'bundle', '--', report['bundle']['path']], check=True)
          PY
      - name: Qualify bounded dense material texture table
        run: |
          python3 -m unittest discover -s tools -p test_texture_table.py
          python3 tools/cook_texture.py --ktx "$RUNNER_TEMP/ktx-build/Release/ktx" --build-dir "$RUNNER_TEMP/ktx-build" --source-archive "$RUNNER_TEMP/ktx-source.tar.gz" --source fixtures/textures/alternate_2x2.json > build/alternate-texture-report.json
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          mesh = json.load(open('build/assets/imported-report.json'))
          alternate = json.load(open('build/alternate-texture-report.json'))
          source = {'schema': 1, 'material_sha256': mesh['materials']['content_id'], 'textures': [mesh['texture']['path'], alternate['path']], 'material_textures': [1, 0]}
          path = pathlib.Path('build/texture-table-assignments.json')
          path.write_text(json.dumps(source, sort_keys=True))
          table = json.loads(subprocess.check_output([sys.executable, 'tools/cook_texture_table.py', '--materials', mesh['materials']['path'], '--assignments', str(path)], text=True))
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'texture_table', '--', mesh['path'], mesh['materials']['path'], table['path']], check=True)
          PY
      - name: Qualify authored multiple-image bundle
        run: |
          cp build/assets/imported-report.json build/shared-image-report.json
          cargo run --locked --manifest-path tools/theia-gltf-import/Cargo.toml -- fixtures/gltf/transformed_scene_textures.gltf build/assets/imported-multi-image-scene.json --unlit-textures
          python3 tools/cook_meshlet_fixture.py --geometry build/assets/imported-multi-image-scene.json --library "$RUNNER_TEMP/meshopt-build/libmeshoptimizer.so" --source-archive "$RUNNER_TEMP/meshoptimizer.tar.gz" --ktx "$RUNNER_TEMP/ktx-build/Release/ktx" --ktx-build "$RUNNER_TEMP/ktx-build" --ktx-source-archive "$RUNNER_TEMP/ktx-source.tar.gz"
          python3 - <<'PY'
          import json, struct, subprocess
          report = json.load(open('build/assets/imported-report.json'))
          assert len(report['textures']) == 2
          for texture, fixture in zip(report['textures'], ['alternate_2x2', 'opaque_2x2']):
              data = open(texture['path'], 'rb').read()
              offset, size, _ = struct.unpack_from('<3Q', data, 80)
              raw = json.load(open('fixtures/textures/' + fixture + '.json'))
              assert data[offset:offset+size] == bytes(v for texel in raw['rgba'] for v in texel)
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'bundle', '--', report['bundle']['path']], check=True)
          PY
      - name: Qualify complete-bundle CPU residency
        run: |
          python3 - <<'PY'
          import json, subprocess
          first = json.load(open('build/assets/imported-report.json'))['bundle']['path']
          second = json.load(open('build/shared-image-report.json'))['bundle']['path']
          subprocess.run(['cargo', 'run', '--locked', '--manifest-path', 'crates/theia-assets/Cargo.toml', '--example', 'bundle_residency', '--', first, second], check=True)
          PY
