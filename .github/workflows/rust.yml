name: Rust qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        app: [theia-gpu-test, theia-render-lab]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path apps/${{ matrix.app }}/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --locked --manifest-path apps/${{ matrix.app }}/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests and build
        run: cargo test --locked --manifest-path apps/${{ matrix.app }}/Cargo.toml
